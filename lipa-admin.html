<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lipa · Excel</title>
  <style>
    :root { color-scheme: light; --green:#174c42; --cream:#f6f2e8; --ink:#18302b; --line:#d8ded9; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--cream); color:var(--ink); font:16px/1.45 system-ui,sans-serif; }
    main { width:min(680px,100%); padding:32px; border:1px solid var(--line); border-radius:22px; background:white; box-shadow:0 18px 55px #173d3420; }
    h1 { margin:0 0 8px; font:700 34px/1.1 Georgia,serif; color:var(--green); }
    p { margin:0 0 22px; }
    label { display:block; margin:18px 0 7px; font-weight:700; }
    input[type=password], input[type=file] { width:100%; padding:13px; border:1px solid var(--line); border-radius:12px; background:#fff; }
    .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
    button { border:0; border-radius:999px; padding:12px 18px; cursor:pointer; font-weight:750; background:var(--green); color:white; }
    button.secondary { background:#e8efec; color:var(--green); }
    button:disabled { opacity:.5; cursor:wait; }
    #status { min-height:24px; margin-top:18px; font-weight:650; }
    small { display:block; margin-top:18px; color:#586964; }
  </style>
</head>
<body>
  <main>
    <h1>Excel de Lipa</h1>
    <p>Descargá el archivo, editá brokers, propiedades, skills o el saludo por horario y volvé a subirlo.</p>
    <label for="token">Clave de administración</label>
    <input id="token" type="password" autocomplete="current-password">
    <div class="actions">
      <button id="download" type="button">Descargar Excel</button>
    </div>
    <label for="workbook">Excel modificado</label>
    <input id="workbook" type="file" accept=".xlsx">
    <div class="actions">
      <button id="upload" type="button">Reemplazar datos</button>
      <button class="secondary" id="openDemo" type="button">Abrir la demo</button>
    </div>
    <div id="status" role="status"></div>
    <small>La hoja Skills gobierna el foco y las instrucciones comerciales. Configuración conserva solamente los saludos por horario.</small>
  </main>
  <script>
    const API = location.hostname === "localhost" || location.hostname === "127.0.0.1"
      ? "http://127.0.0.1:8000" : "https://api.xeleria.com.ar";
    const $ = id => document.getElementById(id);
    const token = () => $("token").value.trim();
    function status(message, error = false) {
      $("status").textContent = message;
      $("status").style.color = error ? "#a52d2d" : "#174c42";
    }
    $("download").addEventListener("click", async () => {
      if (!token()) return status("Ingresá la clave.", true);
      $("download").disabled = true;
      status("Preparando el Excel…");
      try {
        const response = await fetch(`${API}/lipa/admin/catalog.xlsx`, { headers: { "X-Lipa-Admin-Token": token() } });
        if (!response.ok) throw new Error("No se pudo descargar. Revisá la clave.");
        const link = document.createElement("a");
        link.href = URL.createObjectURL(await response.blob());
        link.download = "catalogo_lipa.xlsx";
        link.click();
        URL.revokeObjectURL(link.href);
        status("Excel descargado.");
      } catch (error) { status(error.message, true); }
      finally { $("download").disabled = false; }
    });
    $("upload").addEventListener("click", async () => {
      const file = $("workbook").files[0];
      if (!token()) return status("Ingresá la clave.", true);
      if (!file) return status("Elegí el Excel modificado.", true);
      if (!confirm("Esto reemplaza completamente brokers, propiedades, skills, asignaciones y configuración de Lipa. ¿Continuar?")) return;
      $("upload").disabled = true;
      status("Subiendo y validando…");
      try {
        const form = new FormData();
        form.append("workbook", file);
        const response = await fetch(`${API}/lipa/admin/catalog.xlsx`, {
          method: "POST", headers: { "X-Lipa-Admin-Token": token() }, body: form
        });
        const payload = await response.json();
        if (!response.ok || !payload.ok) throw new Error(payload.detail || "No se pudo importar el Excel.");
        status(`Listo: ${payload.skus} propiedades, ${payload.brokers} brokers y ${payload.skills} skills.`);
      } catch (error) { status(error.message, true); }
      finally { $("upload").disabled = false; }
    });
    $("openDemo").addEventListener("click", () => location.href = "lipa.html");
  </script>
</body>
</html>
